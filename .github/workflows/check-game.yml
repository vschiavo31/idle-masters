name: Validate Idle Masters
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify game rules and data
        run: node --test tests/game.test.cjs
      - name: Install browser test tools
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium webkit
      - name: Verify mobile Chromium and Safari engine
        run: node tests/browser.test.cjs
