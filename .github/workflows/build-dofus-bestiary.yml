name: Build Dofus bestiary
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-dofus-bestiary.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download latest Dofus 3 data
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/dofusdude/dofus3-main/releases/latest)
          TAG=$(printf '%s' "$RELEASE" | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")
          echo "$TAG" > /tmp/dofus_version
          MONSTERS_URL=$(printf '%s' "$RELEASE" | python3 -c "import sys,json; r=json.load(sys.stdin); print(next(a['browser_download_url'] for a in r['assets'] if a['name']=='monsters.json'))")
          FR_URL=$(printf '%s' "$RELEASE" | python3 -c "import sys,json; r=json.load(sys.stdin); print(next((a['browser_download_url'] for a in r['assets'] if a['name']=='fr.json'),''))")
          curl -fL --retry 3 "$MONSTERS_URL" -o /tmp/monsters.json
          if [ -n "$FR_URL" ]; then curl -fL --retry 3 "$FR_URL" -o /tmp/fr.json; else printf '{}' > /tmp/fr.json; fi
      - name: Inspect and build level 1-40 bestiary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=json.load(open('/tmp/monsters.json',encoding='utf-8'))
          fr=json.load(open('/tmp/fr.json',encoding='utf-8'))
          version=Path('/tmp/dofus_version').read_text().strip()
          def shape(v):
              if isinstance(v,dict): return 'dict(%d) keys=%s'%(len(v),list(v)[:20])
              if isinstance(v,list): return 'list(%d)'%len(v)
              return type(v).__name__
          print('ROOT',shape(root))
          # Print the structure down to depth 5, without dumping huge values.
          def inspect(v,path='root',depth=0):
              if depth>5:return
              if isinstance(v,dict):
                  for k,x in list(v.items())[:30]:
                      print('STRUCT',path+'.'+str(k),shape(x))
                      if isinstance(x,(dict,list)):inspect(x,path+'.'+str(k),depth+1)
              elif isinstance(v,list) and v:
                  for i,x in enumerate(v[:3]):
                      print('STRUCT',path+'['+str(i)+']',shape(x))
                      if isinstance(x,(dict,list)):inspect(x,path+'['+str(i)+']',depth+1)
          inspect(root)
          def norm(k):return ''.join(c for c in str(k).lower() if c.isalnum())
          def get(d,*names):
              if not isinstance(d,dict):return None
              low={norm(k):v for k,v in d.items()}
              for n in names:
                  if norm(n) in low:return low[norm(n)]
          def num(v):
              if isinstance(v,(int,float)) and not isinstance(v,bool):return int(v)
              if isinstance(v,str) and v.lstrip('-').isdigit():return int(v)
          # Recursively collect dictionaries that actually look like monster records.
          candidates=[]; visited=0
          def walk(v,path='root',depth=0):
              global visited
              if depth>14:return
              if isinstance(v,dict):
                  visited+=1
                  keys={norm(k) for k in v}
                  has_grades=bool(keys & {'grades','monstergrades'})
                  has_name=bool(keys & {'name','nameid','namefr'})
                  has_id=bool(keys & {'id','monsterid','ankamaid'})
                  if has_grades and (has_name or has_id):candidates.append((path,v))
                  for k,x in v.items():
                      if isinstance(x,(dict,list)):walk(x,path+'.'+str(k),depth+1)
              elif isinstance(v,list):
                  for i,x in enumerate(v):
                      if isinstance(x,(dict,list)):walk(x,path+'['+str(i)+']',depth+1)
          walk(root)
          print('VISITED',visited,'MONSTER_CANDIDATES',len(candidates))
          for p,m in candidates[:3]:print('CANDIDATE',p,'keys',list(m)[:60])
          def grades(v):
              if isinstance(v,list):return [x for x in v if isinstance(x,dict)]
              if isinstance(v,dict):return [x for x in v.values() if isinstance(x,dict)]
              return []
          # Translation lookup: build an integer/string id -> text index recursively once.
          translations={}
          def index_text(v,depth=0):
              if depth>8:return
              if isinstance(v,dict):
                  for k,x in v.items():
                      if isinstance(x,str) and (str(k).isdigit() or isinstance(k,int)):translations[str(k)]=x
                      elif isinstance(x,dict):
                          text=get(x,'text','value','name')
                          if isinstance(text,str) and (str(k).isdigit() or isinstance(k,int)):translations[str(k)]=text
                          index_text(x,depth+1)
                      elif isinstance(x,list):index_text(x,depth+1)
              elif isinstance(v,list):
                  for x in v:index_text(x,depth+1)
          index_text(fr)
          out=[]
          for path,m in candidates:
              gs=grades(get(m,'grades','monsterGrades'))
              levels=[];hp=[];pa=[];pm=[]
              for g in gs:
                  lv=num(get(g,'level','gradeLevel')); life=num(get(g,'lifePoints','life','health','hp'))
                  ap=num(get(g,'actionPoints','pa','ap')); mp=num(get(g,'movementPoints','pm','mp'))
                  stats=get(g,'stats','characteristics')
                  if isinstance(stats,dict):
                      life=life if life is not None else num(get(stats,'lifePoints','life','health','hp'))
                      ap=ap if ap is not None else num(get(stats,'actionPoints','pa','ap'))
                      mp=mp if mp is not None else num(get(stats,'movementPoints','pm','mp'))
                  if lv is not None:levels.append(lv)
                  if life is not None:hp.append(life)
                  if ap is not None:pa.append(ap)
                  if mp is not None:pm.append(mp)
              for key in ('level','minLevel','maxLevel'):
                  n=num(get(m,key))
                  if n is not None:levels.append(n)
              if not levels or min(levels)>40 or max(levels)<1:continue
              name=get(m,'name','nameFr')
              if isinstance(name,dict):name=get(name,'fr','value','text')
              if not isinstance(name,str) or not name.strip():
                  nid=get(m,'nameId');name=translations.get(str(nid))
              if not isinstance(name,str) or not name.strip():continue
              mid=get(m,'id','monsterId','ankamaId')
              out.append({'id':mid,'name':name.strip(),'minLevel':max(1,min(levels)),'maxLevel':min(40,max(levels)),'hpMin':min(hp) if hp else None,'hpMax':max(hp) if hp else None,'pa':max(pa) if pa else None,'pm':max(pm) if pm else None,'raceId':get(m,'raceId','monsterRaceId'),'boss':bool(get(m,'isBoss','boss'))})
          seen=set();clean=[]
          for x in sorted(out,key=lambda x:(x['minLevel'],x['name'],str(x['id']))):
              key=x['id'] if x['id'] is not None else (x['name'],x['minLevel'])
              if key not in seen:seen.add(key);clean.append(x)
          print('BUILT',len(clean),'version',version,'SAMPLE',clean[:10])
          if len(clean)<20:raise SystemExit('Extraction suspiciously small; diagnostic structure printed above')
          Path('dofus-bestiary-1-40.json').write_text(json.dumps({'source':'dofusdude/dofus3-main','version':version,'range':[1,40],'count':len(clean),'monsters':clean},ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          PY
      - name: Commit generated bestiary
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dofus-bestiary-1-40.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update Dofus 3 level 1-40 bestiary data'
          git push
