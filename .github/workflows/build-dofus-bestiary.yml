name: Build Dofus local data
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-dofus-bestiary.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download latest Dofus 3 data
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/dofusdude/dofus3-main/releases/latest)
          TAG=$(printf '%s' "$RELEASE" | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")
          echo "$TAG" > /tmp/dofus_version
          for NAME in monsters.json fr.json items.json item_sets.json effects.json characteristics.json; do
            URL=$(printf '%s' "$RELEASE" | python3 -c "import sys,json; r=json.load(sys.stdin); n='$NAME'; print(next((a['browser_download_url'] for a in r['assets'] if a['name']==n),''))")
            [ -n "$URL" ] && curl -fL --retry 3 "$URL" -o "/tmp/$NAME" || printf '{}' > "/tmp/$NAME"
          done
      - name: Build local game data
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          version=Path('/tmp/dofus_version').read_text().strip()
          def load(n):
              try:return json.load(open('/tmp/'+n,encoding='utf-8'))
              except:return {}
          def norm(k):return ''.join(c for c in str(k).lower() if c.isalnum())
          def get(d,*names):
              if not isinstance(d,dict):return None
              low={norm(k):v for k,v in d.items()}
              for n in names:
                  if norm(n) in low:return low[norm(n)]
          def array(v):
              if isinstance(v,list):return v
              if isinstance(v,dict):
                  a=get(v,'Array')
                  if isinstance(a,list):return a
              return []
          def num(v):
              if isinstance(v,(int,float)) and not isinstance(v,bool):return int(v)
              if isinstance(v,str) and v.lstrip('-').isdigit():return int(v)
          def refs(root):return array(get(get(root,'references'),'RefIds'))
          def refdata(root):return [r.get('data') for r in refs(root) if isinstance(r,dict) and isinstance(r.get('data'),dict)]
          roots={n:load(n+'.json') for n in ('items','item_sets','effects','characteristics','monsters')}
          ridmaps={n:{r.get('rid'):r.get('data') for r in refs(root) if isinstance(r,dict) and r.get('rid') is not None and isinstance(r.get('data'),dict)} for n,root in roots.items()}
          translations={}
          def texts(v,depth=0):
              if depth>10:return
              if isinstance(v,dict):
                  ks=array(get(v,'m_keys'));vs=array(get(v,'m_values'))
                  if ks and len(ks)==len(vs):
                      for k,x in zip(ks,vs):
                          if isinstance(x,str):translations[str(k)]=x
                  for k,x in v.items():
                      if isinstance(x,str) and str(k).isdigit():translations[str(k)]=x
                      elif isinstance(x,(dict,list)):texts(x,depth+1)
              elif isinstance(v,list):
                  for x in v:texts(x,depth+1)
          texts(load('fr.json'))
          def resolve(v,preferred=None,depth=0):
              if depth>6:return v
              if isinstance(v,dict) and 'rid' in v and len(v)<=2:
                  rid=v.get('rid'); order=([preferred] if preferred else [])+['items','effects','characteristics','item_sets','monsters']
                  for src in order:
                      if src and rid in ridmaps.get(src,{}):return resolve(ridmaps[src][rid],src,depth+1)
              return v
          monsters=refdata(roots['monsters']);raw=[]
          for m in monsters:
              gs=[g for g in array(get(m,'grades')) if isinstance(g,dict)]; levels=[];hp=[];pa=[];pm=[]
              for g in gs:
                  for target,names in ((levels,('level','gradeLevel')),(hp,('lifePoints','life','health','hp')),(pa,('actionPoints','pa','ap')),(pm,('movementPoints','pm','mp'))):
                      v=num(get(g,*names)); target.append(v) if v is not None else None
              if not levels or min(levels)>40 or max(levels)<1:continue
              name=translations.get(str(get(m,'nameId')))
              if name:raw.append({'id':get(m,'id'),'name':name,'minLevel':max(1,min(levels)),'maxLevel':min(40,max(levels)),'hpMin':min(hp) if hp else None,'hpMax':max(hp) if hp else None,'pa':max(pa) if pa else None,'pm':max(pm) if pm else None,'raceId':get(m,'race'),'boss':bool(get(m,'isBoss','boss'))})
          blocked=re.compile(r"(?i)(balise|bombe|bomb'|tourelle|cadran|cawotte|coffre|curseur|glyphe|piège|portail|tentacule|invocation|double|chaton|lapino|sac animé|épée volante|aiguille|boufballe|attaquant |capitaine |bloqueur|caisse|cherche trésor|coffiot|coquille|surveillante|sentinelle|d[ée]voreur)")
          clean=[];seen=set()
          for x in sorted(raw,key=lambda x:(x['minLevel'],x['name'],str(x['id']))):
              if x['id'] in seen or blocked.search(x['name']):continue
              seen.add(x['id'])
              if not x['boss'] and ((x['hpMax'] or 0)<=1 or (x['pa'] or 0)<=0 or (x['pm'] is not None and x['pm']<0)):continue
              clean.append(x)
          Path('dofus-bestiary-1-40.json').write_text(json.dumps({'source':'dofusdude/dofus3-main','version':version,'range':[1,40],'rawCount':len(raw),'count':len(clean),'filter':'playable-pvm-candidates-v3-no-devourers','monsters':clean},ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          SLOT_TYPES={1:'Amulette',9:'Anneau',10:'Ceinture',16:'Chapeau',17:'Cape',11:'Bottes'}
          chars={num(get(c,'id')):c for c in refdata(roots['characteristics']) if num(get(c,'id')) is not None}
          effects_by_id={num(get(e,'id')):e for e in refdata(roots['effects']) if num(get(e,'id')) is not None}
          def translated(d,*keys):
              for k in keys:
                  n=num(get(d,k))
                  if n is not None and str(n) in translations:return translations[str(n)]
          def effect_info(raw_e):
              e=resolve(raw_e,'items')
              if not isinstance(e,dict):return None
              eraw=get(e,'effectId','effect','actionId'); edef=resolve(eraw,'effects')
              eid=num(eraw)
              if isinstance(eraw,dict):eid=num(get(edef,'id')) if isinstance(edef,dict) else None
              if eid is not None and eid in effects_by_id:edef=effects_by_id[eid]
              if not isinstance(edef,dict):edef={}
              cid=num(get(edef,'characteristic','characteristicId','characId'))
              cdef=chars.get(cid,{})
              label=translated(cdef,'nameId','descriptionId') or translated(edef,'descriptionId','nameId')
              if label:
                  label=re.sub(r'[#{}~%+\-0-9.,]+',' ',label);label=re.sub(r'\s+',' ',label).strip(' :')
              dn=num(get(e,'diceNum','min','value')); ds=num(get(e,'diceSide','max')); dv=num(get(e,'value'))
              if ds in (None,0):
                  fixed=dn if dn is not None else dv
                  mn=mx=fixed
              else:
                  mn=dn if dn not in (None,0) else 1
                  mx=ds
              return {'effectId':eid,'characteristicId':cid,'stat':label,'min':mn,'max':mx,'fixed':mn==mx if mn is not None and mx is not None else False}
          out=[]
          for x in refdata(roots['items']):
              iid=num(get(x,'id')); level=num(get(x,'level')); typ=num(get(x,'typeId','type')); name=translations.get(str(get(x,'nameId')))
              if iid is None or level is None or not 1<=level<=40 or typ not in SLOT_TYPES or not name:continue
              setid=num(get(x,'itemSetId','setId')); eff=[]
              for raw_e in array(get(x,'possibleEffects','effects')):
                  z=effect_info(raw_e)
                  if z:eff.append(z)
              out.append({'id':iid,'name':name,'level':level,'slot':SLOT_TYPES[typ],'typeId':typ,'setId':setid if setid and setid>0 else None,'effects':eff})
          kept_ids={x['id'] for x in out}; sout=[]
          for s in refdata(roots['item_sets']):
              sid=num(get(s,'id')); name=translations.get(str(get(s,'nameId'))); ids=[num(x) for x in array(get(s,'items','itemIds'))]; ids=[x for x in ids if x in kept_ids]
              if sid is None or not name or not ids:continue
              bonuses=[]
              for n,row in enumerate(array(get(s,'effects','setEffects')),start=1):
                  vals=array(get(row,'values')) if isinstance(row,dict) else array(row)
                  parsed=[effect_info(v) for v in vals];parsed=[v for v in parsed if v]
                  if parsed:bonuses.append({'pieces':n,'effects':parsed})
              sout.append({'id':sid,'name':name,'itemIds':ids,'pieceCount':len(ids),'bonuses':bonuses})
          resolved=sum(1 for i in out for e in i['effects'] if e.get('stat'))
          total=sum(len(i['effects']) for i in out)
          invalid=sum(1 for i in out for e in i['effects'] if e.get('stat') is None or e.get('min') is None or e.get('max') is None)
          inverted=sum(1 for i in out for e in i['effects'] if e.get('min') is not None and e.get('max') is not None and e['min']>e['max'])
          print('BESTIARY',len(clean),'WEARABLES_1_40',len(out),'SETS',len(sout),'RESOLVED',resolved,'OF',total,'INVALID',invalid,'INVERTED',inverted,'version',version)
          if len(clean)<50:raise SystemExit('Bestiary suspiciously small')
          if len(out)<50:raise SystemExit('Wearable equipment extraction suspiciously small')
          if total and resolved!=total:raise SystemExit('Some equipment effect labels remain unresolved')
          if invalid:raise SystemExit('Some equipment effects have incomplete values')
          if inverted:raise SystemExit('Some equipment effect ranges are inverted')
          Path('dofus-equipment-1-40.json').write_text(json.dumps({'source':'dofusdude/dofus3-main','version':version,'range':[1,40],'scope':'wearable-only-no-resources-no-consumables-no-weapons','count':len(out),'resolvedEffects':resolved,'totalEffects':total,'items':out},ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          Path('dofus-item-sets.json').write_text(json.dumps({'source':'dofusdude/dofus3-main','version':version,'scope':'sets-containing-kept-wearables','count':len(sout),'sets':sout},ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          PY
      - name: Commit generated local data
        shell: bash
        run: |
          set -e
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dofus-bestiary-1-40.json dofus-equipment-1-40.json dofus-item-sets.json
          git diff --cached --quiet && exit 0
          git commit -m 'Filter Devourers from local Dofus bestiary'
          git push
