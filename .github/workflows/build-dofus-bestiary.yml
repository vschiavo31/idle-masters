name: Build Dofus local data
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-dofus-bestiary.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download latest Dofus 3 data
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/dofusdude/dofus3-main/releases/latest)
          TAG=$(printf '%s' "$RELEASE" | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")
          echo "$TAG" > /tmp/dofus_version
          for NAME in monsters.json fr.json items.json item_sets.json effects.json characteristics.json; do
            URL=$(printf '%s' "$RELEASE" | python3 -c "import sys,json; r=json.load(sys.stdin); n='$NAME'; print(next((a['browser_download_url'] for a in r['assets'] if a['name']==n),''))")
            if [ -n "$URL" ]; then curl -fL --retry 3 "$URL" -o "/tmp/$NAME"; else printf '{}' > "/tmp/$NAME"; fi
          done
      - name: Build local game data
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          version=Path('/tmp/dofus_version').read_text().strip()
          def load(n):
              try:return json.load(open('/tmp/'+n,encoding='utf-8'))
              except:return {}
          def norm(k):return ''.join(c for c in str(k).lower() if c.isalnum())
          def get(d,*names):
              if not isinstance(d,dict):return None
              low={norm(k):v for k,v in d.items()}
              for n in names:
                  if norm(n) in low:return low[norm(n)]
          def array(v):
              if isinstance(v,list):return v
              if isinstance(v,dict):
                  a=get(v,'Array')
                  if isinstance(a,list):return a
              return []
          def num(v):
              if isinstance(v,(int,float)) and not isinstance(v,bool):return int(v)
              if isinstance(v,str) and v.lstrip('-').isdigit():return int(v)
          def refdata(root):
              return [r.get('data') for r in array(get(get(root,'references'),'RefIds')) if isinstance(r,dict) and isinstance(r.get('data'),dict)]
          translations={}
          def texts(v,depth=0):
              if depth>10:return
              if isinstance(v,dict):
                  ks=array(get(v,'m_keys'));vs=array(get(v,'m_values'))
                  if ks and len(ks)==len(vs):
                      for k,x in zip(ks,vs):
                          if isinstance(x,str):translations[str(k)]=x
                  for k,x in v.items():
                      if isinstance(x,str) and str(k).isdigit():translations[str(k)]=x
                      elif isinstance(x,(dict,list)):texts(x,depth+1)
              elif isinstance(v,list):
                  for x in v:texts(x,depth+1)
          texts(load('fr.json'))
          monsters=refdata(load('monsters.json'))
          raw=[]
          for m in monsters:
              if get(m,'grades') is None or get(m,'id') is None:continue
              gs=[g for g in array(get(m,'grades')) if isinstance(g,dict)]; levels=[];hp=[];pa=[];pm=[]
              for g in gs:
                  lv=num(get(g,'level','gradeLevel'));life=num(get(g,'lifePoints','life','health','hp'));ap=num(get(g,'actionPoints','pa','ap'));mp=num(get(g,'movementPoints','pm','mp'))
                  if lv is not None:levels.append(lv)
                  if life is not None:hp.append(life)
                  if ap is not None:pa.append(ap)
                  if mp is not None:pm.append(mp)
              if not levels or min(levels)>40 or max(levels)<1:continue
              name=translations.get(str(get(m,'nameId')))
              if name:raw.append({'id':get(m,'id'),'name':name,'minLevel':max(1,min(levels)),'maxLevel':min(40,max(levels)),'hpMin':min(hp) if hp else None,'hpMax':max(hp) if hp else None,'pa':max(pa) if pa else None,'pm':max(pm) if pm else None,'raceId':get(m,'race'),'boss':bool(get(m,'isBoss','boss'))})
          blocked=re.compile(r"(?i)(balise|bombe|bomb'|tourelle|cadran|cawotte|coffre|curseur|glyphe|piège|portail|tentacule|invocation|double|chaton|lapino|sac animé|épée volante|aiguille|boufballe|attaquant |capitaine |bloqueur|caisse|cherche trésor|coffiot|coquille|surveillante|sentinelle)")
          clean=[];seen=set()
          for x in sorted(raw,key=lambda x:(x['minLevel'],x['name'],str(x['id']))):
              if x['id'] in seen or blocked.search(x['name']):continue
              seen.add(x['id'])
              if not x['boss'] and ((x['hpMax'] or 0)<=1 or (x['pa'] or 0)<=0 or (x['pm'] is not None and x['pm']<0)):continue
              clean.append(x)
          Path('dofus-bestiary-1-40.json').write_text(json.dumps({'source':'dofusdude/dofus3-main','version':version,'range':[1,40],'rawCount':len(raw),'count':len(clean),'filter':'playable-pvm-candidates-v2','monsters':clean},ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          items=refdata(load('items.json')); sets=refdata(load('item_sets.json'))
          out=[]
          for x in items:
              iid=get(x,'id'); level=num(get(x,'level')); name=translations.get(str(get(x,'nameId')))
              if iid is None or level is None or not 1<=level<=40 or not name:continue
              typ=get(x,'typeId','type'); setid=get(x,'itemSetId','setId')
              effects=[]
              for e in array(get(x,'possibleEffects','effects')):
                  if not isinstance(e,dict):continue
                  effects.append({'k':get(e,'effectId','id'),'v':get(e,'value','diceNum','min'),'m':get(e,'diceSide','max')})
              out.append({'id':iid,'name':name,'level':level,'typeId':typ,'setId':setid,'effects':effects})
          sout=[]
          for s in sets:
              sid=get(s,'id'); name=translations.get(str(get(s,'nameId'))); ids=array(get(s,'items','itemIds'))
              if sid is None or not name:continue
              sout.append({'id':sid,'name':name,'itemIds':ids,'effects':get(s,'effects','setEffects')})
          print('BESTIARY',len(clean),'ITEMS_1_40',len(out),'SETS',len(sout),'version',version)
          if len(clean)<50:raise SystemExit('Bestiary suspiciously small')
          if len(out)<50:raise SystemExit('Equipment extraction suspiciously small')
          Path('dofus-equipment-1-40.json').write_text(json.dumps({'source':'dofusdude/dofus3-main','version':version,'range':[1,40],'count':len(out),'items':out},ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          Path('dofus-item-sets.json').write_text(json.dumps({'source':'dofusdude/dofus3-main','version':version,'count':len(sout),'sets':sout},ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          PY
      - name: Commit generated local data
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dofus-bestiary-1-40.json dofus-equipment-1-40.json dofus-item-sets.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update local Dofus level 1-40 game data'
          git push
