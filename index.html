function mob(){return M.find(x=>x.id===D.mid)||M[0]}function meta(id){let x=I[id];return{n:x[0],i:x[1],s:x[2],set:x[3],r:x[4],x:x[5]}}function lg(t,c=''){let d=document.createElement('div');d.className=c;d.textContent=t;$('log').prepend(d)}function sb(){let c={},o={};Object.values(D.w).forEach(q=>{if(q){let s=meta(q.id).set;c[s]=(c[s]||0)+1}});for(let[s,n]of Object.entries(c))for(let[z,b]of Object.entries(SET[s]||{}))if(n>=+z)for(let[k,v]of Object.entries(b))o[k]=(o[k]||0)+v;return o}function gt(){let t={};Object.values(D.w).forEach(q=>{if(q)for(let[k,v]of Object.entries(q.st))t[k]=(t[k]||0)+v});for(let[k,v]of Object.entries(sb()))t[k]=(t[k]||0)+v;return t}function st(k){return gt()[k]||0}function bonus(e){let m={Terre:'Force',Feu:'Intelligence',Eau:'Chance',Air:'Agilite',Neutre:'Neutre'};return(D.inv[e]||0)+st(m[e])+st('Puissance')}function mh(){return D.bh+st('Vitalite')}function maxpa(){return 6+st('PA')}function wis(){return D.inv.Sagesse+st('Sagesse')}function roll(id){let x=meta(id),a={};for(let[k,v]of Object.entries(x.x))a[k]=R(v[0],v[1]);return{uid:D.uid++,id,st:a}}function txt(a){return Object.entries(a).map(([k,v])=>'+'+v+' '+k).join(' • ')}function jet(q){let x=meta(q.id),sum=0,max=0;for(let[k,v]of Object.entries(x.x)){sum+=(q.st[k]-v[0]);max+=(v[1]-v[0])}return max?Math.round(100*sum/max):100}function gainxp(x){let g=Math.floor(x*(1+wis()/100));D.xp+=g;lg('✨ +'+g+' XP');while(D.xp>=need(D.lv)){D.xp-=need(D.lv);D.lv++;D.pts+=5;D.bh+=8;D.hp=mh();lg('⭐ Niveau '+D.lv+' ! +5 points','gold')}}function loot(){let m=mob(),n=0;m.loot.forEach(id=>{let x=meta(id),rate=Math.min(80,x.r*(1+st('Prospection')/100));if(Math.random()*100<rate){let q=roll(id);D.bag.push(q);n++;lg('🎁 '+x.n+' — jet '+jet(q)+'%','gold')}});if(!n)lg('🎲 Aucun équipement.')}function victory(){let m=mob();D.k+=R(m.k[0],m.k[1]);gainxp(m.xp);loot();D.master[m.id]=(D.master[m.id]||0)+1;if(m.boss){D.boss[m.boss]=(D.boss[m.boss]||0)+1;lg('🏆 Boss vaincu ! Une nouvelle zone peut être disponible.','gold')}D.end=true;D.tr=false;render();setTimeout(()=>{D.eh=m.h;D.hp=Math.min(mh(),D.hp+Math.ceil(mh()*.2));D.rd=1;PA=maxpa();D.tr=true;D.end=false;render();if(D.auto)autoStep()},550)}function cast(i,fromAuto=false){if(!D.tr||D.end)return;let p=SP[i];if(PA<p[3])return;if(p[6]==='heal'){PA-=p[3];let h=Math.floor(R(p[4],p[5])*(1+st('Soins')/100));D.hp=Math.min(mh(),D.hp+h);lg('❤️ Soin mineur : +'+h+' PV')}else{PA-=p[3];let d=Math.floor(R(p[4],p[5])*(1+bonus(p[2])/100))+st('Dommage'+p[2]);if(Math.random()*100<st('Critique')){d=Math.floor(d*1.25);lg('💥 Coup critique !')}D.eh=Math.max(0,D.eh-d);lg(p[1]+' '+p[0]+' : '+d+' '+p[2]);if(D.eh<=0)return victory()}render();if(fromAuto)setTimeout(autoStep,160)}function enemyTurn(fromAuto=false){if(!D.tr||D.end)return;D.tr=false;render();setTimeout(()=>{let m=mob(),res=Math.min(85,Math.max(0,st('Res'+m.e))),d=Math.max(1,Math.floor(R(m.a[0],m.a[1])*(1-res/100)));D.hp=Math.max(0,D.hp-d);lg('👹 '+m.n+' attaque : -'+d+' PV');if(D.hp<=0){lg('💀 Défaite');D.auto=false;D.end=true;render();setTimeout(()=>{D.hp=mh();D.eh=m.h;D.rd=1;PA=maxpa();D.tr=true;D.end=false;render()},700);return}D.rd++;PA=maxpa();D.tr=true;render();if(fromAuto)setTimeout(autoStep,180)},350)}function autoStep(){clearTimeout(timer);if(!D.auto||D.end||!D.tr)return;let m=mob();if((D.master[m.id]||0)<25){D.auto=false;render();return}let affordable=SP.map((p,i)=>({p,i})).filter(x=>x.p[6]==='dmg'&&x.p[3]<=PA);if(affordable.length){affordable.sort((a,b)=>(b.p[5]/b.p[3])-(a.p[5]/a.p[3]));timer=setTimeout(()=>cast(affordable[0].i,true),180)}else timer=setTimeout(()=>enemyTurn(true),180)}function toggleAuto(){let n=D.master[mob().id]||0;if(n<25){lg('🔒 Auto-combat à 25 victoires sur ce monstre.');return}D.auto=!D.auto;render();if(D.auto)autoStep()}function spend(n){let c=n==='Sagesse'?3:1;if(D.pts>=c){D.pts-=c;D.inv[n]++;render()}}function choose(id){D.auto=false;D.mid=id;D.eh=mob().h;D.rd=1;PA=maxpa();D.tr=true;D.end=false;render()}function go(z){if(!Z[z].unlock(D))return;D.z=z;let m= function side(){let e=$('side');e.innerHTML='';if(D.tab==='world'){Z.forEach((z,i)=>{let ok=z.unlock(D),b=document.createElement('button');b.className='zone '+(i===D.z?'sel':'');b.disabled=!ok;b.innerHTML=z.i+' <b>'+z.n+'</b><br><span class="mut">'+(ok?(i===D.z?'Zone actuelle':'Voyager'):'🔒 Boss précédent requis')+'</span>';b.onclick=()=>go(i);e.append(b)})}else if(D.tab==='mobs'){M.filter(x=>x.z===D.z).forEach(m=>{let n=D.master[m.id]||0,b=document.createElement('button');b.className='monster '+(m.id===D.mid?'sel ':'')+(m.boss?'boss':'');b.innerHTML=m.i+' <b>'+m.n+(m.boss?' 👑':'')+'</b><br><span class="mut">Niv. '+m.l+' • '+m.xp+' XP • maîtrise '+n+'/25'+(n>=25?' 🤖':'')+'</span>';b.onclick=()=>choose(m.id);e.append(b)})}else if(D.tab==='bag'){if(!D.bag.length)e.innerHTML='<p class="mut">Inventaire vide.</p>';D.bag.slice().sort((a,b)=>jet(b)-jet(a)).forEach(q=>{let x=meta(q.id),d=document.createElement('div');d.className='item';d.innerHTML='<div class="row"><b>'+x.i+' '+x.n+'</b><span class="gold">'+jet(q)+'%</span></div><div class="mut">'+x.s+' • Panoplie '+x.set+'</div><div>'+txt(q.st)+'</div>';let b=document.createElement('button');b.textContent='Équiper';b.onclick=()=>equip(q.uid);let s=document.createElement('button');s.textContent='Vendre';s.onclick=()=>sell(q.uid);d.append(b,s);e.append(d)})}else if(D.tab==='worn'){Object.entries(D.w).forEach(([s,q])=>{let d=document.createElement('div');d.className='item';d.innerHTML='<b>'+s+'</b><br>'+(q?meta(q.id).i+' '+meta(q.id).n+' <span class="gold">'+jet(q)+'%</span><div class="mut">'+txt(q.st)+'</div>':'<span class="mut">Vide</span>');if(q){let b=document.createElement('button');b.textContent='Retirer';b.onclick=()=>uneq(s);d.append(b)}e.append(d)})}else{let c={};Object.values(D.w).forEach(q=>{if(q){let s=meta(q.id).set;c[s]=(c[s]||0)+1}});for(let[n,t]of Object.entries(SET)){let d=document.createElement('div'),z=c[n]||0;d.className='item';d.innerHTML='<b>✨ '+n+'</b> <span class="mut">('+z+')</span>';for(let[k,v]of Object.entries(t))d.innerHTML+='<div class="'+(z>=+k?'good':'mut')+'">'+k+' pièces : '+txt(v)+'</div>';e.append(d)}}}
function render(){let t=gt(),h=mh(),n=need(D.lv),m=mob();$('lv').textContent=D.lv;$('xt').textContent=D.xp+' / '+n+' • Sagesse +'+wis()+'%';$('xb').style.width=(D.xp/n*100)+'%';$('hp').textContent=D.hp+' / '+h;$('hb').style.width=(D.hp/h*100)+'%';$('pa').textContent=PA+' / '+maxpa();$('ka').textContent=D.k;$('pts').textContent=D.pts;$('stats').innerHTML='';[['Terre','🌿'],['Feu','🔥'],['Eau','💧'],['Air','💨'],['Neutre','⚪'],['Sagesse','📘']].forEach(([n,i])=>{let r=document.createElement('div');r.className='stat';r.innerHTML='<span>'+i+' '+n+'</span><span>'+D.inv[n]+'</span>';let b=document.createElement('button');b.textContent=n==='Sagesse'?'+ (3)':'+';b.disabled=D.pts<(n==='Sagesse'?3:1);b.onclick=()=>spend(n);r.append(b);$('stats').append(r)});$('tot').textContent=Object.keys(t).length?txt(t):'Aucun bonus';$('zoneName').textContent=Z[D.z].i+' '+Z[D.z].n;$('turn').textContent=D.tr&&!D.end?'🟢 Ton tour':'🔴 Tour ennemi';$('round').textContent='Tour '+D.rd;$('mi').textContent=m.i;$('mn').textContent=m.n+(m.boss?' 👑':'');$('minfo').textContent='Niv. '+m.l+' • '+m.xp+' XP • dégâts '+m.e;$('eh').textContent=D.eh+' / '+m.h+' PV';$('eb').style.width=(D.eh/m.h*100)+'%';let ma=D.master[m.id]||0;$('master').textContent='Maîtrise '+ma+' • '+(ma>=25?'🤖 Auto débloqué':(25-ma)+' victoire(s) avant auto');$('spells').innerHTML='';SP.forEach((p,i)=>{let b=document.createElement('button');b.className='spell';b.disabled=!D.tr||D.end||PA<p[3]||(p[6]==='heal'&&D.hp>=h);b.innerHTML='<b>'+p[1]+' '+p[0]+'</b> — '+p[3]+' PA<br><span class="mut">'+(p[6]==='heal'?'Rend des PV':p[2]+' • bonus '+bonus(p[2])+'%')+'</span>';b.onclick=()=>cast(i);$('spells').append(b)});$('endBtn').disabled=!D.tr||D.end||D.auto;$('autoBtn').disabled=ma<25;$('autoBtn').textContent=D.auto?'⏹ Arrêter auto':'🤖 Auto-combat'+(ma<25?' 🔒':'');document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.t===D.tab));side();localStorage.setItem('idleMastersV2',JSON.stringify(D))}
$('endBtn').onclick=()=>enemyTurn(false);$('autoBtn').onclick=toggleAuto;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{D.tab=b.dataset.t;render()});try{let x=JSON.parse(localStorage.getItem('idleMastersV2'));if(x)D={...D,...x};else{let o=JSON.parse(localStorage.getItem('idleMastersV1'));if(o){D.lv=o.lv||1;D.xp=o.xp||0;D.pts=o.pts||0;D.inv={...D.inv,...(o.inv||{})};D.bh=o.bh||100;D.hp=o.hp||100;D.k=o.k||0;D.bag=o.bag||[];D.w={...D.w,...(o.w||{})};D.uid=o.uid||1}}}catch(e){}D.master=D.master||{};D.boss=D.boss||{};D.z=Math.min(D.z||0,Z.length-1);if(!Z[D.z].unlock(D))D.z=0;if(!M.find(x=>x.id===D.mid&&x.z===D.z))D.mid=M.find(x=>x.z===D.z).id;D.eh=Math.min(D.eh||mob().h,mob().h);D.hp=Math.min(D.hp,mh());PA=maxpa();lg('⚔ Idle Masters V2 chargé.');render();
