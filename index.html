const SET={Bouftou:{2:{Vitalite:10},3:{Force:5,Intelligence:5},4:{Sagesse:5},5:{Puissance:5}},Tofu:{2:{Agilite:5}},Royal:{2:{Vitalite:25,Sagesse:5},3:{Puissance:8}},Piou:{2:{Agilite:8}},Arakne:{2:{Vitalite:15}},Bandit:{2:{Puissance:5}},Milirat:{2:{Vitalite:25,Sagesse:5}},'Pâtures':{2:{Vitalite:20},4:{Puissance:7}},Sauvage:{2:{Force:10,Puissance:5}},Gardien:{2:{Vitalite:35,Sagesse:8}},Sylvestre:{2:{Agilite:10,Chance:10}},Sanglier:{2:{Force:12}},Prespic:{2:{Sagesse:12}},'Chêne':{2:{Vitalite:50,Puissance:10}}};const SP=[['Pression','🌿','Terre',3,16,22,'dmg'],['Flamiche','🔥','Feu',2,9,13,'dmg'],['Vague','💧','Eau',3,15,21,'dmg'],['Lame de vent','💨','Air',3,14,23,'dmg'],['Coup brutal','⚪','Neutre',4,25,32,'dmg'],['Soin mineur','❤️','Soin',3,13,20,'heal']];
let D={lv:1,xp:0,pts:0,inv:{Terre:0,Feu:0,Eau:0,Air:0,Neutre:0,Sagesse:0},bh:100,hp:100,k:0,z:0,mid:'tofu',eh:65,rd:1,tr:true,end:false,bag:[],w:{Coiffe:null,Cape:null,Amulette:null,Anneau1:null,Anneau2:null,Ceinture:null,Bottes:null},uid:1,master:{},boss:{},auto:false},PA=6,timer=null,mode='picker',lastResult=null,$=x=>document.getElementById(x),R=(a,b)=>Math.floor(a+Math.random()*(b-a+1)),need=l=>Math.round(100*Math.pow(1.45,l-1));
function mob(){return M.find(x=>x.id===D.mid)||M[0]}function meta(id){let x=I[id];return{n:x[0],i:x[1],s:x[2],set:x[3],r:x[4],x:x[5]}}function sb(){let c={},o={};Object.values(D.w).forEach(q=>{if(q){let s=meta(q.id).set;c[s]=(c[s]||0)+1}});for(let[s,n]of Object.entries(c))for(let[z,b]of Object.entries(SET[s]||{}))if(n>=+z)for(let[k,v]of Object.entries(b))o[k]=(o[k]||0)+v;return o}function gt(){let t={};Object.values(D.w).forEach(q=>{if(q)for(let[k,v]of Object.entries(q.st))t[k]=(t[k]||0)+v});for(let[k,v]of Object.entries(sb()))t[k]=(t[k]||0)+v;return t}function st(k){return gt()[k]||0}function bonus(e){let m={Terre:'Force',Feu:'Intelligence',Eau:'Chance',Air:'Agilite',Neutre:'Neutre'};return(D.inv[e]||0)+st(m[e])+st('Puissance')}function mh(){return D.bh+st('Vitalite')}function maxpa(){return 6+st('PA')}function wis(){return D.inv.Sagesse+st('Sagesse')}function txt(a){return Object.entries(a).map(([k,v])=>'+'+v+' '+k).join(' • ')}function roll(id){let x=meta(id),a={};for(let[k,v]of Object.entries(x.x))a[k]=R(v[0],v[1]);return{uid:D.uid++,id,st:a}}function jet(q){let x=meta(q.id),sum=0,max=0;for(let[k,v]of Object.entries(x.x)){sum+=(q.st[k]-v[0]);max+=(v[1]-v[0])}return max?Math.round(100*sum/max):100}function save(){localStorage.setItem('idleMastersV2',JSON.stringify(D))}function lg(t,c=''){let d=document.createElement('div');d.className=c;d.textContent=t;$('log').prepend(d)}
function gainxp(x){let g=Math.floor(x*(1+wis()/100));D.xp+=g;while(D.xp>=need(D.lv)){D.xp-=need(D.lv);D.lv++;D.pts+=5;D.bh+=8}return g}function doLoot(){let out=[];mob().loot.forEach(id=>{let x=meta(id),rate=Math.min(80,x.r*(1+st('Prospection')/100));if(Math.random()*100<rate){let q=roll(id);D.bag.push(q);out.push(q)}});return out}

function cast(i,fromAuto=false){if(!D.tr||D.end)return;let p=SP[i];if(PA<p[3])return;if(p[6]==='heal'){PA-=p[3];let h=Math.floor(R(p[4],p[5])*(1+st('Soins')/100));D.hp=Math.min(mh(),D.hp+h);lg('❤️ Soin mineur : +'+h+' PV')}else{PA-=p[3];let d=Math.floor(R(p[4],p[5])*(1+bonus(p[2])/100))+st('Dommage'+p[2]);if(Math.random()*100<st('Critique'))d=Math.floor(d*1.25);D.eh=Math.max(0,D.eh-d);lg(p[1]+' '+p[0]+' : '+d+' dégâts');if(D.eh<=0)return victory()}render();if(fromAuto)setTimeout(autoStep,150)}function enemyTurn(fromAuto=false){if(!D.tr||D.end)return;D.tr=false;render();setTimeout(()=>{let m=mob(),res=Math.min(85,Math.max(0,st('Res'+m.e))),d=Math.max(1,Math.floor(R(m.a[0],m.a[1])*(1-res/100)));D.hp=Math.max(0,D.hp-d);lg('👹 '+m.n+' : -'+d+' PV');if(D.hp<=0){D.auto=false;D.end=true;lg('💀 Défaite');setTimeout(()=>{D.hp=mh();startFight(D.mid)},600);return}D.rd++;PA=maxpa();D.tr=true;render();if(fromAuto)setTimeout(autoStep,160)},350)}function autoStep(){clearTimeout(timer);if(!D.auto||D.end||!D.tr)return;let ma=D.master[D.mid]||0;if(ma<25){D.auto=false;return render()}let a=SP.map((p,i)=>({p,i})).filter(x=>x.p[6]==='dmg'&&x.p[3]<=PA);if(a.length){a.sort((x,y)=>y.p[5]/y.p[3]-x.p[5]/x.p[3]);timer=setTimeout(()=>cast(a[0].i,true),160)}else timer=setTimeout(()=>enemyTurn(true),160)}function toggleAuto(){if((D.master[D.mid]||0)<25)return;D.auto=!D.auto;render();if(D.auto)autoStep()}
function startFight(id){D.mid=id;let m=mob();D.z=m.z;D.eh=m.h;D.hp=mh();D.rd=1;PA=maxpa();D.tr=true;D.end=false;D.auto=false;mode='fight';$('log').innerHTML='';render()}function spend(n){let c=n==='Sagesse'?3:1;if(D.pts>=c){D.pts-=c;D.inv[n]++;render()}}function slot(q){let s=meta(q.id).s;if(s!=='Anneau')return s;if(!D.w.Anneau1)return'Anneau1';if(!D.w.Anneau2)return'Anneau2';return'Anneau1'}function equip(u){let j=D.bag.findIndex(x=>x.uid===u);if(j<0)return;let q=D.bag[j],s=slot(q),o=D.w[s];if(o)D.bag.push(o);D.w[s]=q;D.bag.splice(j,1);D.hp=Math.min(mh(),D.hp+(q.st.Vitalite||0));render()}function uneq(s){if(D.w[s]){D.bag.push(D.w[s]);D.w[s]=null;D.hp=Math.min(D.hp,mh());render()}}function sell(u){let j=D.bag.findIndex(x=>x.uid===u);if(j<0)return;let q=D.bag[j],v=Math.max(5,Math.round(Object.values(q.st).reduce((a,b)=>a+b,0)/2));D.k+=v;D.bag.splice(j,1);render()}
function dashboard(){let t=gt(),n=need(D.lv);$('lv').textContent=D.lv;$('xpTxt').textContent=D.xp+' / '+n+' XP';$('xpBar').style.width=D.xp/n*100+'%';$('dashHp').textContent=mh();$('dashPa').textContent=maxpa();$('dashK').textContent=D.k;$('pts').textContent=D.pts;$('bonus').textContent=Object.keys(t).length?txt(t):'Aucun bonus';$('stats').innerHTML='';[['Terre','🌿'],['Feu','🔥'],['Eau','💧'],['Air','💨'],['Neutre','⚪'],['Sagesse','📘']].forEach(([n,i])=>{let r=document.createElement('div');r.className='stat';r.innerHTML='<span>'+i+' '+n+'</span><b>'+D.inv[n]+'</b>';let b=document.createElement('button');b.textContent=n==='Sagesse'?'+ (3 pts)':'+';b.disabled=D.pts<(n==='Sagesse'?3:1);b.onclick=()=>spend(n);r.append(b);$('stats').append(r)})}
function inventory(){let bag=$('bag');bag.innerHTML='';$('bagCount').textContent=D.bag.length+' objet(s)';if(!D.bag.length)bag.innerHTML='<div class="mut">Sac vide.</div>';D.bag.slice().sort((a,b)=>jet(b)-jet(a)).forEach(q=>{let x=meta(q.id),d=document.createElement('div');d.className='card item';d.innerHTML='<div class="row"><b>'+x.i+' '+x.n+'</b><span class="gold">Jet '+jet(q)+'%</span></div><div class="mut">'+x.s+' • '+x.set+'</div><div>'+txt(q.st)+'</div>';let e=document.createElement('button');e.textContent='Équiper';e.onclick=()=>equip(q.uid);let s=document.createElement('button');s.textContent='Vendre';s.onclick=()=>sell(q.uid);d.append(e,s);bag.append(d)});let w=$('worn');w.innerHTML='';Object.entries(D.w).forEach(([s,q])=>{let d=document.createElement('div');d.className='card item';d.innerHTML='<b>'+s+'</b><br>'+(q?meta(q.id).i+' '+meta(q.id).n+' <span class="gold">'+jet(q)+'%</span><div class="mut">'+txt(q.st)+'</div>':'<span class="mut">Vide</span>');if(q){let b=document.createElement('button');b.textContent='Retirer';b.onclick=()=>uneq(s);d.append(b)}w.append(d)});let c={};Object.values(D.w).forEach(q=>{if(q){let s=meta(q.id).set;c[s]=(c[s]||0)+1}});$('sets').innerHTML=Object.entries(c).map(([s,n])=>'✨ '+s+' : '+n+' pièce(s)').join('<br>')||'<span class="mut">Aucune panoplie active</span>'}
function picker(){let z=$('zones');z.innerHTML='';Z.forEach((x,i)=>{let ok=x.unlock(D),b=document.createElement('button');b.className='choice '+(i===D.z?'sel':'');b.disabled=!ok;b.innerHTML=x.i+' <b>'+x.n+'</b><br><span class="mut">'+(ok?'Disponible':'🔒 Boss précédent requis')+'</span>';b.onclick=()=>{D.z=i;render()};z.append(b)});let e=$('mobs');e.innerHTML='';M.filter(x=>x.z===D.z).forEach(m=>{let b=document.createElement('button'),ma=D.master[m.id]||0;b.className='choice '+(m.boss?'boss':'');b.innerHTML=m.i+' <b>'+m.n+(m.boss?' 👑':'')+'</b><br><span class="mut">Niv. '+m.l+' • '+m.xp+' XP • Maîtrise '+ma+'/25</span>';b.onclick=()=>startFight(m.id);e.append(b)})}
function fight(){let m=mob(),h=mh(),ma=D.master[m.id]||0;$('fightZone').textContent=Z[m.z].i+' '+Z[m.z].n;$('turn').textContent=D.tr&&!D.end?'🟢 Ton tour':'🔴 Tour ennemi';$('mobIcon').textContent=m.i;$('mobName').textContent=m.n+(m.boss?' 👑':'');$('mobInfo').textContent='Niveau '+m.l+' • '+m.e;$('enemyHp').textContent=D.eh+' / '+m.h+' PV';$('enemyBar').style.width=D.eh/m.h*100+'%';$('master').textContent='Maîtrise '+ma+(ma>=25?' • 🤖 Auto débloqué':' / 25');$('fightHp').textContent=D.hp+' / '+h;$('playerBar').style.width=D.hp/h*100+'%';$('fightPa').textContent=PA+' / '+maxpa();$('spells').innerHTML='';SP.forEach((p,i)=>{let b=document.createElement('button');b.className='spell';b.disabled=!D.tr||D.end||PA<p[3]||(p[6]==='heal'&&D.hp>=h);b.innerHTML='<b>'+p[1]+' '+p[0]+'</b> — '+p[3]+' PA<br><span class="mut">'+(p[6]==='heal'?'Soin':p[2]+' • bonus '+bonus(p[2])+'%')+'</span>';b.onclick=()=>cast(i);$('spells').append(b)});$('endBtn').disabled=!D.tr||D.end||D.auto;$('autoBtn').disabled=ma<25;$('autoBtn').textContent=D.auto?'⏹ Arrêter auto':'🤖 Auto-combat'+(ma<25?' 🔒':'')}
function result(){let m=M.find(x=>x.id===lastResult.mid);$('resultMob').textContent=m.i+' '+m.n;$('resultXp').textContent='+'+lastResult.xp+' XP';$('resultK').textContent='+'+lastResult.k+' 🪙';$('resultDrops').innerHTML=lastResult.drops.length?lastResult.drops.map(q=>{let x=meta(q.id);return '<div class="card">'+x.i+' <b>'+x.n+'</b> <span class="gold">Jet '+jet(q)+'%</span><div class="mut">'+txt(q.st)+'</div></div>'}).join(''):'<div class="mut">Aucun équipement obtenu.</div>'}
function render(){dashboard();inventory();picker();$('picker').style.display=mode==='picker'?'block':'none';$('fight').style.display=mode==='fight'?'block':'none';$('result').style.display=mode==='result'?'block':'none';if(mode==='fight')fight();if(mode==='result'&&lastResult)result();$('topK').textContent='🪙 '+D.k;save()}
function showPage(p){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('on',x.id===p));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('on',x.dataset.page===p));if(p==='combat'&&mode==='result'&&!lastResult)mode='picker';render()}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>showPage(b.dataset.page));$('endBtn').onclick=()=>enemyTurn(false);$('autoBtn').onclick=toggleAuto;$('backMob').onclick=()=>{D.auto=false;mode='picker';render()};$('again').onclick=()=>startFight(lastResult.mid);$('changeMob').onclick=()=>{mode='picker';render()};$('changeZone').onclick=()=>{D.z=0;mode='picker';render()};try{let x=JSON.parse(localStorage.getItem('idleMastersV2'));if(x)D={...D,...x}}catch(e){}D.master=D.master||{};D.boss=D.boss||{};D.hp=mh();PA=maxpa();render();</script></body></html>
