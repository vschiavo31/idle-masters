<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Idle Masters V1.1</title><style>:root{--p:#20261a;--c:#303924;--l:#52613c;--t:#f3f0df;--m:#b9bea9;--g:#e5b84b;--ok:#6ecb63;--r:#d85f5f}*{box-sizing:border-box}body{margin:0;background:#151a11;color:var(--t);font-family:system-ui,-apple-system,sans-serif}.w{max-width:1200px;margin:auto;padding:12px}.grid{display:grid;grid-template-columns:240px 1fr 320px;gap:12px}.p{background:var(--p);border:1px solid var(--l);border-radius:14px;padding:14px}.c{background:var(--c);border-radius:10px;padding:10px;margin:8px 0}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.mut{color:var(--m);font-size:12px}h2,h3{margin:4px 0 10px}.big{font-size:34px;font-weight:800}.bar{height:10px;background:#111;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--ok)}.xp{background:var(--g)}.enemy{background:var(--r)}button{background:#39462d;color:var(--t);border:1px solid #65774c;border-radius:9px;padding:10px;font-weight:700;touch-action:manipulation}.tabs{display:flex;gap:5px;flex-wrap:wrap}.tab.on,.sel{outline:2px solid var(--g)}.spells{display:grid;grid-template-columns:1fr 1fr;gap:8px}.spell{text-align:left;min-height:75px}.monster{width:100%;text-align:left;margin:4px 0}.statline{display:grid;grid-template-columns:1fr auto auto;gap:5px;align-items:center;margin:4px 0}.item{border:1px solid #4d5a3a;border-radius:9px;padding:9px;margin:7px 0}.drop{color:#ffd56a}.log{height:160px;overflow:auto;background:#11150e;border-radius:9px;padding:8px;font-size:12px}.tag{font-size:11px;background:#14180f;padding:3px 6px;border-radius:20px}.set{color:#9ce492}@media(max-width:850px){.grid{grid-template-columns:1fr}.spells{grid-template-columns:1fr 1fr}}</style></head><body><div class="w"><div class="grid"><section class="p"><h2>🧙 Aventurier</h2><div class="c" style="text-align:center"><div class="mut">NIVEAU</div><div id="lv" class="big"></div><div class="bar"><div id="xb" class="fill xp"></div></div><div id="xt" class="mut"></div></div><div class="c"><div class="row"><span>❤️ PV</span><b id="hp"></b></div><div class="bar"><div id="hb" class="fill"></div></div><div class="row"><span>🔷 PA</span><b id="pa"></b></div><div class="row"><span>🪙 Kamas</span><b id="ka"></b></div></div><h3>Caractéristiques</h3><div class="row"><span>Points</span><b id="pts"></b></div><div id="stats"></div><div class="c"><b>Bonus équipement</b><div id="tot" class="mut"></div></div></section><main class="p"><div class="row"><div><div class="mut">Zone : Incarnam</div><h2 id="turn"></h2></div><span id="round" class="tag"></span></div><div class="c" style="text-align:center"><div id="mi" style="font-size:62px"></div><h2 id="mn"></h2><div id="minfo" class="mut"></div><div class="bar"><div id="eb" class="fill enemy"></div></div><div id="eh" class="mut"></div></div><h3>Sorts</h3><div id="spells" class="spells"></div><button id="endTurnBtn" type="button" style="width:100%;margin-top:9px">⏭ Fin du tour</button><h3>Journal</h3><div id="log" class="log"></div></main><aside class="p"><div class="tabs"><button class="tab on" data-t="mobs">👹 Monstres</button><button class="tab" data-t="bag">🎒 Inventaire</button><button class="tab" data-t="worn">🛡 Équipé</button><button class="tab" data-t="sets">✨ Panoplies</button></div><div id="side"></div></aside></div></div><script>const I={tofuHat:{n:'Coiffe du Tofu',i:'👒',s:'Coiffe',set:'Tofu',r:18,x:{Agilite:[3,7],Vitalite:[2,6]}},tofuCape:{n:'Cape du Tofu',i:'🧥',s:'Cape',set:'Tofu',r:14,x:{Agilite:[2,6],Initiative:[5,15]}},boufHat:{n:'Coiffe du Bouftou',i:'👒',s:'Coiffe',set:'Bouftou',r:14,x:{Force:[16,20],Intelligence:[16,20]}},boufCape:{n:'Cape Bouffante',i:'🧥',s:'Cape',set:'Bouftou',r:12,x:{Vitalite:[11,20],Force:[6,10]}},boufAmu:{n:'Amulette du Bouftou',i:'📿',s:'Amulette',set:'Bouftou',r:10,x:{Force:[11,15],Intelligence:[11,15],Vitalite:[11,15]}},boufBoots:{n:'Boufbottes',i:'🥾',s:'Bottes',set:'Bouftou',r:9,x:{Vitalite:[11,20],Agilite:[3,7]}},boufBelt:{n:'Ceinture du Bouftou',i:'🎗️',s:'Ceinture',set:'Bouftou',r:8,x:{Vitalite:[11,20],Sagesse:[3,6]}},chefRing:{n:'Anneau du Chef',i:'💍',s:'Anneau',set:'Chef',r:8,x:{Force:[10,18],Vitalite:[15,28],Puissance:[2,5],Critique:[1,2]}},royalHat:{n:'Coiffe Royale',i:'👑',s:'Coiffe',set:'Royal',r:5,x:{Vitalite:[30,55],Force:[15,25],Sagesse:[8,14],Critique:[1,3]}},royalAmu:{n:'Amulette Royale',i:'📿',s:'Amulette',set:'Royal',r:3,x:{PA:[1,1],Vitalite:[20,35],Sagesse:[8,12],Prospection:[5,8]}}};const M=[{n:'Tofu',i:'🐥',l:1,h:65,a:[5,9],e:'Air',xp:30,k:[2,5],loot:['tofuHat','tofuCape']},{n:'Bouftou',i:'🐏',l:3,h:110,a:[8,13],e:'Terre',xp:48,k:[5,10],loot:['boufHat','boufCape','boufAmu','boufBoots','boufBelt']},{n:'Chef de guerre Bouftou',i:'🐏',l:6,h:230,a:[14,21],e:'Neutre',xp:105,k:[12,22],loot:['chefRing']},{n:'Bouftou Royal',i:'👑',l:10,h:440,a:[21,30],e:'Terre',xp:245,k:[30,55],loot:['royalHat','royalAmu']}];const SP=[['Pression','🌿','Terre',3,16,22],['Flamiche','🔥','Feu',2,9,13],['Vague','💧','Eau',3,15,21],['Lame de vent','💨','Air',3,14,23],['Coup brutal','⚪','Neutre',4,25,32]];const SET={Bouftou:{2:{Vitalite:10},3:{Force:5,Intelligence:5},4:{Sagesse:5},5:{Puissance:5}},Tofu:{2:{Agilite:5}},Chef:{2:{Vitalite:15,Puissance:3}},Royal:{2:{Vitalite:25,Sagesse:5}}};let S={lv:1,xp:0,pts:0,inv:{Terre:0,Feu:0,Eau:0,Air:0,Neutre:0,Sagesse:0},bh:100,hp:100,k:0,mi:0,eh:65,rd:1,tr:true,end:false,bag:[],w:{Coiffe:null,Cape:null,Amulette:null,Anneau1:null,Anneau2:null,Ceinture:null,Bottes:null},tab:'mobs',uid:1},PA=6,$=x=>document.getElementById(x),R=(a,b)=>Math.floor(a+Math.random()*(b-a+1)),need=l=>Math.round(100*Math.pow(1.45,l-1)),mob=()=>M[S.mi];function lg(t,c=''){let d=document.createElement('div');d.className=c;d.textContent=t;$('log').prepend(d)}function sb(){let c={},o={};Object.values(S.w).forEach(q=>{if(q)c[I[q.id].set]=(c[I[q.id].set]||0)+1});for(let[s,n]of Object.entries(c))for(let[z,b]of Object.entries(SET[s]||{}))if(n>=+z)for(let[k,v]of Object.entries(b))o[k]=(o[k]||0)+v;return o}function gt(){let t={};Object.values(S.w).forEach(q=>{if(q)for(let[k,v]of Object.entries(q.st))t[k]=(t[k]||0)+v});for(let[k,v]of Object.entries(sb()))t[k]=(t[k]||0)+v;return t}function st(k){return gt()[k]||0}function bonus(e){let m={Terre:'Force',Feu:'Intelligence',Eau:'Chance',Air:'Agilite',Neutre:'Force'};return(S.inv[e]||0)+st(m[e])+st('Puissance')}function mh(){return S.bh+st('Vitalite')}function maxpa(){return 6+st('PA')}function wisdom(){return S.inv.Sagesse+st('Sagesse')}function roll(id){let a={};for(let[k,v]of Object.entries(I[id].x))a[k]=R(v[0],v[1]);return{uid:S.uid++,id,st:a}}function gainxp(x){let g=Math.floor(x*(1+wisdom()/100));S.xp+=g;lg('✨ +'+g+' XP');while(S.xp>=need(S.lv)){S.xp-=need(S.lv);S.lv++;S.pts+=5;S.bh+=8;S.hp=mh();lg('⭐ NIVEAU '+S.lv+' : +5 points !','drop')}}function loot(){mob().loot.forEach(id=>{if(Math.random()*100<I[id].r*(1+st('Prospection')/100)){S.bag.push(roll(id));lg('🎁 DROP : '+I[id].n,'drop')}})}function win(){let m=mob(),k=R(m.k[0],m.k[1]);S.k+=k;gainxp(m.xp);loot();lg('🏆 Victoire ! +'+k+' kamas');S.end=1;S.tr=0;render();setTimeout(()=>{S.eh=m.h;S.hp=Math.min(mh(),S.hp+Math.ceil(mh()*.2));S.rd=1;PA=maxpa();S.tr=1;S.end=0;render()},450)}function cast(i){if(!S.tr||S.end)return;let p=SP[i];if(PA<p[3])return;PA-=p[3];let d=Math.floor(R(p[4],p[5])*(1+bonus(p[2])/100))+st('Dommage'+p[2]);if(Math.random()*100<st('Critique'))d=Math.floor(d*1.25);S.eh=Math.max(0,S.eh-d);lg(p[1]+' '+p[0]+' : '+d);if(!S.eh)return win();render()}function enemyTurn(){if(!S.tr||S.end)return;S.tr=false;render();setTimeout(function(){let m=mob();if(S.eh<=0)return;let resistance=Math.min(90,Math.max(0,st('Res'+m.e)));let raw=R(m.a[0],m.a[1]);let d=Math.max(1,Math.floor(raw*(1-resistance/100)));S.hp=Math.max(0,S.hp-d);lg('👹 '+m.n+' attaque : -'+d+' PV');if(S.hp<=0){lg('💀 Défaite');S.end=true;render();setTimeout(function(){S.hp=mh();S.eh=m.h;S.rd=1;PA=maxpa();S.tr=true;S.end=false;render()},650);return}S.rd++;PA=maxpa();S.tr=true;render()},500)}function spend(n){let c=n==='Sagesse'?3:1;if(S.pts>=c){S.pts-=c;S.inv[n]++;render()}}function choose(i){S.mi=i;S.eh=mob().h;S.rd=1;PA=maxpa();S.tr=true;S.end=false;render()}function slot(q){if(I[q.id].s!=='Anneau')return I[q.id].s;if(!S.w.Anneau1)return'Anneau1';if(!S.w.Anneau2)return'Anneau2';return'Anneau1'}function equip(u){let j=S.bag.findIndex(x=>x.uid===u);if(j<0)return;let q=S.bag[j],s=slot(q),o=S.w[s];if(o)S.bag.push(o);S.w[s]=q;S.bag.splice(j,1);S.hp=Math.min(mh(),S.hp+(q.st.Vitalite||0));render()}function uneq(s){if(S.w[s]){S.bag.push(S.w[s]);S.w[s]=null;S.hp=Math.min(S.hp,mh());render()}}function txt(a){return Object.entries(a).map(([k,v])=>'+'+v+' '+k).join(' • ')}function side(){let e=$('side');e.innerHTML='';if(S.tab==='mobs')M.forEach((m,i)=>{let b=document.createElement('button');b.className='monster '+(i===S.mi?'sel':'');b.innerHTML=m.i+' <b>'+m.n+'</b><br><span class="mut">Niv. '+m.l+' • '+m.xp+' XP</span>';b.onclick=()=>choose(i);e.append(b)});else if(S.tab==='bag'){if(!S.bag.length)e.innerHTML='<p class="mut">Inventaire vide.</p>';S.bag.forEach(q=>{let d=document.createElement('div'),x=I[q.id];d.className='item';d.innerHTML='<b>'+x.i+' '+x.n+'</b><div class="mut">'+x.s+' • '+x.set+'</div><div>'+txt(q.st)+'</div>';let b=document.createElement('button');b.textContent='Équiper';b.onclick=()=>equip(q.uid);d.append(b);e.append(d)})}else if(S.tab==='worn')Object.entries(S.w).forEach(([s,q])=>{let d=document.createElement('div');d.className='item';d.innerHTML='<b>'+s+'</b><br>'+(q?I[q.id].n+'<div class="mut">'+txt(q.st)+'</div>':'<span class="mut">Vide</span>');if(q){let b=document.createElement('button');b.textContent='Retirer';b.onclick=()=>uneq(s);d.append(b)}e.append(d)});else for(let[n,t]of Object.entries(SET)){let d=document.createElement('div');d.className='item';d.innerHTML='<b>✨ Panoplie '+n+'</b>';for(let[k,v]of Object.entries(t))d.innerHTML+='<div class="mut">'+k+' pièces : '+txt(v)+'</div>';e.append(d)}}function render(){let t=gt(),h=mh(),n=need(S.lv),m=mob();$('lv').textContent=S.lv;$('xt').textContent=S.xp+' / '+n+' XP • +'+wisdom()+'%';$('xb').style.width=S.xp/n*100+'%';$('hp').textContent=S.hp+' / '+h;$('hb').style.width=S.hp/h*100+'%';$('pa').textContent=PA+' / '+maxpa();$('ka').textContent=S.k;$('pts').textContent=S.pts;$('stats').innerHTML='';[['Terre','🌿'],['Feu','🔥'],['Eau','💧'],['Air','💨'],['Neutre','⚪'],['Sagesse','📘']].forEach(([n,i])=>{let r=document.createElement('div');r.className='statline';r.innerHTML='<span>'+i+' '+n+'</span><span>'+S.inv[n]+'</span>';let b=document.createElement('button');b.textContent=n==='Sagesse'?'+ (3)':'+';b.disabled=S.pts<(n==='Sagesse'?3:1);b.onclick=()=>spend(n);r.append(b);$('stats').append(r)});$('tot').textContent=Object.keys(t).length?txt(t):'Aucun bonus';$('turn').textContent=S.tr&&!S.end?'🟢 Ton tour':'🔴 Tour ennemi';$('round').textContent='Tour '+S.rd;$('mi').textContent=m.i;$('mn').textContent=m.n;$('minfo').textContent='Niv. '+m.l+' • '+m.xp+' XP • attaque '+m.e;$('eh').textContent=S.eh+' / '+m.h+' PV';$('eb').style.width=S.eh/m.h*100+'%';$('spells').innerHTML='';SP.forEach((p,i)=>{let b=document.createElement('button');b.className='spell';b.disabled=!S.tr||S.end||PA<p[3];b.innerHTML='<b>'+p[1]+' '+p[0]+'</b> — '+p[3]+' PA<br><span class="mut">'+p[2]+' • bonus '+bonus(p[2])+'%</span>';b.onclick=()=>cast(i);$('spells').append(b)});$('endTurnBtn').disabled=!S.tr||S.end;side();localStorage.setItem('idleMastersV1',JSON.stringify(S))}document.getElementById('endTurnBtn').addEventListener('click',enemyTurn);document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));side()});try{let x=JSON.parse(localStorage.getItem('idleMastersV1'));if(x)S=x}catch(e){}S.hp=Math.min(S.hp,mh());S.eh=S.eh||mob().h;S.tr=true;S.end=false;PA=maxpa();lg('⚔ Idle Masters V1.1 chargé.');render();</script></body></html>
